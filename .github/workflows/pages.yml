name: Publicar INVEST PI

on:
  push:
    branches: ["main"]
    paths:
      - "dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verificar arquivos essenciais
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/style.css
          test -s dist/app.js
          test -s dist/data.json
          test -s dist/vendor/xlsx.js
          node --check dist/app.js
          node -e "JSON.parse(require('fs').readFileSync('dist/data.json', 'utf8'))"

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
